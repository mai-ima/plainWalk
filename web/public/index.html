<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#fafbf9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="歩いた道だけを描く白地図。端末に記録する、無料の非公式 Web 版。"
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" />
    <link rel="apple-touch-icon" href="icon.png" />
    <link rel="stylesheet" href="style.css" />
    <title>PlainWalk — 白地図</title>
  </head>
  <body>
    <div id="app">
      <main id="mapPage">
        <div id="mapViewport" aria-label="白地図。ドラッグで移動、ピンチで拡大">
          <div id="tiles"></div>
          <svg id="map" xmlns="http://www.w3.org/2000/svg">
            <g id="mapGrid"></g>
            <g id="mapOutlines"></g>
            <g id="doodles"></g>
            <g id="trails"></g>
            <g id="pins"></g>
            <g id="location"></g>
          </svg>
          <div id="emptyMap">
            <span class="little-route">⌁</span>
            <p>「軌跡を残す」をタップして<br />最初の道を描こう</p>
          </div>
        </div>
        <header class="map-header">
          <button
            class="circle"
            data-action="menu"
            aria-label="メニュー"
            id="menuButton"
          ></button>
          <div class="map-caption">
            <strong>歩いた道が、地図になる。</strong
            ><span>まだ誰も描いていない場所を、あなたの一歩で。</span>
          </div>
          <button
            class="circle"
            data-action="answer"
            aria-label="答え合わせマップ"
            id="answerButton"
          ></button>
        </header>
        <div id="mapBanner" hidden></div>
        <div id="editorToolbar" hidden>
          <button data-action="editCancel">キャンセル</button
          ><button data-action="editUndo">戻す</button
          ><button data-action="editSave">保存</button>
        </div>
        <div id="doodleToolbar" hidden>
          <button data-action="doodleCancel">キャンセル</button
          ><button data-action="doodleUndo">戻す</button
          ><button data-action="doodleSave">完了</button>
        </div>
        <div class="answer-actions">
          <button class="primary compact" data-action="bookmarkPick">
            しおりを挟む</button
          ><button class="secondary compact" data-action="doodleStart">
            らくがき
          </button>
        </div>
        <div id="flagDirection" hidden></div>
        <div class="map-tools">
          <button
            class="circle"
            data-action="spot"
            aria-label="ここいいな"
            id="spotButton"
          ></button
          ><small id="spotToolLabel">ここいいな</small
          ><button
            class="circle"
            data-action="locate"
            aria-label="現在地"
            id="locateButton"
          ></button
          ><small>現在地</small
          ><button
            class="circle"
            data-action="layers"
            aria-label="地図レイヤー"
            id="layerButton"
          ></button
          ><small>地図レイヤー</small>
        </div>
        <div class="map-stats">
          <div>
            <small>今日の歩数</small>
            <p>
              <span class="stat-icon">♧</span><b id="steps">—</b><em>歩</em>
            </p>
          </div>
          <div>
            <small>開拓した道</small>
            <p>
              <span class="stat-icon">✓</span><b id="todayNew">0.00</b
              ><em>km</em>
            </p>
          </div>
          <div>
            <small>総開拓距離</small>
            <p>
              <span class="stat-icon">⚑</span><b id="totalNew">0.00</b
              ><em>km</em>
            </p>
          </div>
        </div>
        <div class="record-control">
          <button
            id="recordStatus"
            data-action="recordOptions"
            aria-label="記録の詳細と終了"
            hidden
          ></button
          ><button
            id="recordButton"
            class="record-button"
            data-action="record"
            aria-label="散歩を始める"
          ></button
          ><small id="recordLabel">散歩を始める</small>
        </div>
        <div class="map-scale">
          <span></span><small id="scaleText">100 m</small>
        </div>
        <div id="attribution" hidden>
          ©
          <a
            href="https://www.openstreetmap.org/copyright"
            target="_blank"
            rel="noopener"
            >OpenStreetMap</a
          >
        </div>
        <div class="zoom">
          <button data-action="zoomIn" aria-label="拡大">＋</button
          ><button data-action="zoomOut" aria-label="縮小">−</button>
        </div>
      </main>
      <main id="contentPage" hidden></main>
      <nav class="tabbar" aria-label="メインナビゲーション">
        <button data-tab="map" class="selected">
          <span id="tabMap"></span>マイマップ</button
        ><button data-tab="records"><span id="tabRecords"></span>記録</button
        ><button data-tab="profile">
          <span id="tabProfile"></span>プロフィール
        </button>
      </nav>
    </div>
    <div id="overlay" hidden>
      <div
        id="sheet"
        role="dialog"
        aria-modal="true"
        aria-labelledby="sheetTitle"
      >
        <div class="sheet-handle"></div>
        <header>
          <button id="sheetBack" data-action="back" aria-label="戻る" hidden>
            ‹
          </button>
          <h2 id="sheetTitle"></h2>
          <button id="sheetClose" data-action="close">閉じる</button>
        </header>
        <div id="sheetBody"></div>
      </div>
    </div>
    <div id="toast" role="status" hidden></div>
    <input
      type="file"
      id="importFile"
      accept=".gpx,.tcx,.json,application/json"
      hidden
    />
    <script type="module" src="app.js"></script>
  </body>
</html>
