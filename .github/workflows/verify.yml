name: Verify web and iOS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: npm test
      - run: npm run check
      - run: python3 ios/validate_project.py
  ios:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - name: Compile iOS app and Live Activity extension
        run: >-
          xcodebuild -project ios/PlainWalk.xcodeproj -scheme PlainWalk
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator' -derivedDataPath .build/ios
          CODE_SIGNING_ALLOWED=NO build
      - name: Launch bundled app on iPhone Simulator
        run: bash scripts/ios-simulator-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-screenshot
          path: .build/screenshots
          if-no-files-found: ignore
