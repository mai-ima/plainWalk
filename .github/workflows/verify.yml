name: Verify web and iOS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: npm run check
      - run: python3 ios/validate_project.py
      - run: python3 -m pip install -r scripts/requirements-swift.txt
      - run: python3 scripts/check-swift-syntax.py
      - run: npx playwright install --with-deps chromium
      - name: Verify mobile browser flows
        run: |
          python3 -m http.server 4173 --directory dist > "$RUNNER_TEMP/plainwalk-preview.log" 2>&1 &
          npm run test:browser
  ios-build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - name: Compile iOS app and Live Activity extension
        run: >-
          xcodebuild -project ios/PlainWalk.xcodeproj -scheme PlainWalk
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator' -derivedDataPath .build/ios
          ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build
      - name: Package compiled Simulator app
        run: >-
          tar -czf .build/plainwalk-ios-simulator.tar.gz
          -C .build/ios/Build/Products/Debug-iphonesimulator PlainWalk.app
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: .build/plainwalk-ios-simulator.tar.gz
          retention-days: 7
          overwrite: true
  ios:
    needs: ios-build
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Warm iPhone Simulator
        run: |
          PW_SIM_DEVICE=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for group in data["devices"].values() for d in group if "iPhone" in d["name"] and d.get("isAvailable")))')
          xcrun simctl boot "$PW_SIM_DEVICE" || true
      - uses: actions/download-artifact@v4
        with:
          name: ios-simulator-app
          path: .build
      - name: Restore compiled app
        run: |
          mkdir -p .build/ios/Build/Products/Debug-iphonesimulator
          tar -xzf .build/plainwalk-ios-simulator.tar.gz -C .build/ios/Build/Products/Debug-iphonesimulator
      - name: Launch bundled app on iPhone Simulator
        run: bash scripts/ios-simulator-smoke.sh
      - name: Verify diagnostic screen capture
        run: swift scripts/check-native-screenshot.swift .build/screenshots/ios-native-developer.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-screenshot
          path: .build/screenshots
          if-no-files-found: ignore
          overwrite: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-replay-export-sample
          path: .build/exports
          if-no-files-found: ignore
          overwrite: true
  native-screens:
    needs: ios-build
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [records, collections, creation, maps, settings-a, settings-b, layers-developer]
    steps:
      - uses: actions/checkout@v4
      - name: Warm iPhone Simulator
        run: |
          PW_SIM_DEVICE=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for group in data["devices"].values() for d in group if "iPhone" in d["name"] and d.get("isAvailable")))')
          xcrun simctl boot "$PW_SIM_DEVICE" || true
      - uses: actions/download-artifact@v4
        with:
          name: ios-simulator-app
          path: .build
      - name: Restore compiled app
        run: |
          mkdir -p .build/ios/Build/Products/Debug-iphonesimulator
          tar -xzf .build/plainwalk-ios-simulator.tar.gz -C .build/ios/Build/Products/Debug-iphonesimulator
      - name: Capture native screens with isolated fixtures
        run: python3 scripts/capture-native-screens.py '${{ matrix.group }}'
      - name: Verify captured screen text and scroll sections
        run: swift scripts/check-native-captures.swift '.build/native-screens/${{ matrix.group }}/manifest.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-all-screens-${{ matrix.group }}
          path: .build/native-screens/${{ matrix.group }}
          if-no-files-found: ignore
          overwrite: true
  playgrounds:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run playgrounds
      - name: Compile Swift Playgrounds app package
        working-directory: ios/Playgrounds/PlainWalk.swiftpm
        run: >-
          xcodebuild -scheme PlainWalkPlaygrounds
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$GITHUB_WORKSPACE/.build/playgrounds"
          CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plainwalk-swift-playgrounds
          path: artifacts/packages/PlainWalk.swiftpm.zip
          if-no-files-found: error
